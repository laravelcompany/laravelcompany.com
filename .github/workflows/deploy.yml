name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Astro build cache
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: ${{ runner.os }}-astro-cache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-astro-cache-

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test && python3 -m unittest discover -s tests -p "test_*.py" && python3 -m unittest discover tools/ebay-books/tests

      - name: Build Astro site
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1
          compression-level: 9

  deploy:
    needs: build
    # GitHub-hosted runners turned out unusable for this org (Sep 28 probe:
    # trivial ubuntu-latest job fails in ~2s with zero jobs/steps and no logs,
    # same signature as the deploy job instant-failures). Back to the
    # self-hosted runner; its intermittent TLS drops on Cloudflare's
    # /pages/assets/upload are handled by the retry loop below (assets upload
    # by content hash, so retries resume).
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # Cloudflare's upload API intermittently fails mid-upload of large
          # sites (13k+ files) with an unparsable "Error: {}" body. Assets
          # upload by content hash, so a retry resumes instead of restarting.
          # Sep 28: failures cluster in windows (1 success at 07:40 UTC vs 9
          # failures after 08:35, each dying 42-57s into the bulk upload with
          # SocketError "other side closed" - reads as Cloudflare edge/API
          # instability or rate-limiting for this egress). Hash-resume makes
          # attempts cumulative, so ride out the window: 8 attempts, 2 min
          # apart (worst case ~16 min of retries).
          for attempt in 1 2 3 4 5 6 7 8; do
            if npx wrangler@4 pages deploy dist \
              --project-name "$CLOUDFLARE_PROJECT_NAME" \
              --branch "$DEPLOY_BRANCH" \
              --commit-hash "${{ github.sha }}" \
              --commit-message "$HEAD_COMMIT_MESSAGE"; then
              exit 0
            fi
            echo "::warning::wrangler deploy attempt $attempt of 8 failed"
            # Surface the real API error from wrangler's debug log before retrying.
            latest_log=$(ls -t /home/runner/.config/.wrangler/logs/wrangler-*.log /root/.config/.wrangler/logs/wrangler-*.log 2>/dev/null | head -1)
            if [ -n "$latest_log" ]; then
              echo "--- wrangler log tail ($latest_log)"
              tail -n 40 "$latest_log" || true
              echo "---"
            fi
            if [ "$attempt" -lt 8 ]; then
              sleep 120
            fi
          done
          echo "::error::wrangler deploy failed after 8 attempts"
          exit 1
