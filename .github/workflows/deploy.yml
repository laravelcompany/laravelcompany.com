name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  build-and-deploy:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 360
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Astro build cache
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: ${{ runner.os }}-astro-cache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-astro-cache-

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
        run: |
          # Cloudflare's /pages/assets/upload intermittently fails mid-upload of
          # large sites (13k+ files) with an unparsable "Error: {}" body. Assets
          # upload by content hash, so a retry resumes instead of restarting.
          for attempt in 1 2 3; do
            if npx wrangler@4 pages deploy dist \
              --project-name "$CLOUDFLARE_PROJECT_NAME" \
              --branch "$DEPLOY_BRANCH" \
              --commit-hash "${{ github.sha }}" \
              --commit-message "${{ github.event.head_commit.message }}"; then
              exit 0
            fi
            echo "::warning::wrangler deploy attempt $attempt of 3 failed"
            # Surface the real API error from wrangler's debug log before retrying.
            latest_log=$(ls -t /root/.config/.wrangler/logs/wrangler-*.log 2>/dev/null | head -1)
            if [ -n "$latest_log" ]; then
              echo "--- wrangler log tail ($latest_log)"
              tail -n 40 "$latest_log" || true
              echo "---"
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 60))
            fi
          done
          echo "::error::wrangler deploy failed after 3 attempts"
          exit 1
